<style>
/* Layout: one full-bleed WebGL viewport; flat instrument glass floats at the edges, telemetry set in mono. */
:root{
  color-scheme:dark;
  --void:#04060c; --glass:rgba(8,12,22,.76); --line:rgba(170,188,225,.2);
  --fg:#e9edf5; --dim:#93a0b8; --accent:#ffb347; --ok:#7be0a8; --warn:#ff6b4a; --ink:#0a0d14;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Saira',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:4px 6px;color:var(--fg);font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 8px #000}
.lab:hover{color:var(--accent)}
.lab.done::after{content:" \2713";color:var(--ok)}
#fade{position:fixed;inset:0;pointer-events:none;opacity:0;background:#000}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--fg);opacity:.7;pointer-events:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui button,#ui input,#panel,#surf{pointer-events:auto}
#top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px}
h1{margin:0;font:700 22px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 10px rgba(0,0,0,.6)}
#mode{margin:4px 0 0;color:var(--fg);font:400 11px/1.3 var(--mono);letter-spacing:.06em;text-shadow:0 1px 2px #000,0 0 6px #000}
#tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:flex-end}
#spaceTools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
#spaceTools label{font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
#spaceTools output{color:var(--fg)}
#speed{width:110px;accent-color:var(--accent)}
#explored{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--dim)}
.btn{font:600 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:var(--glass);border:1px solid var(--line);padding:9px 12px;cursor:pointer;border-radius:2px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.go:hover{filter:brightness(1.12);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mid{position:relative;flex:1;min-height:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:2px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#panel{position:absolute;right:0;top:0;width:min(340px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-user-select:text;user-select:text}
#pKlass,.cap{margin:0;font:500 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h2{margin:0;font:700 34px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
#pBlurb{margin:0;color:var(--fg);max-width:60ch}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0}
dl>div{display:contents}
dt,dd{margin:0;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
dt{color:var(--dim);font:400 11px/1.6 var(--mono);letter-spacing:.06em;padding-right:14px;white-space:nowrap}
dd{font-variant-numeric:tabular-nums;text-align:right}
#pNote{margin:0;color:var(--dim);font-size:12px;order:3}
#pStats{order:2}
#pAct{display:flex;gap:8px;flex-wrap:wrap}
#surf{position:absolute;left:0;top:0;width:min(310px,78%);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#surf h2{font-size:26px}
#sCond{margin:0;color:var(--dim);font:400 11px/1.4 var(--mono)}
#sObj{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font:400 12px/1.4 var(--mono);font-variant-numeric:tabular-nums}
#sObj li{padding-top:4px;border-top:1px solid var(--line)}
#sObj li.ok{color:var(--ok)}
#hull{display:flex;align-items:center;gap:8px;font:400 11px/1 var(--mono);color:var(--dim)}
#hull i{flex:1;height:6px;border:1px solid var(--line);display:block}
#hull b{display:block;height:100%;background:var(--ok);width:100%}
#sGoal{margin:0;font-size:13px}
#retry{align-self:flex-start}
#entry{position:absolute;inset:0;display:grid;place-items:end center}
.tele{padding:12px 16px;text-align:center;min-width:min(420px,100%)}
#ePhase{margin:0 0 8px;font:700 20px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.tele dl{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
.tele dl>div{display:block}
.tele dt{border:0;padding:0;white-space:normal}
.tele dd{border:0;padding:0;text-align:center;font:500 16px/1.4 var(--mono)}
#bot{display:flex;flex-direction:column;gap:10px;align-items:center}
#toast{margin:0;max-width:min(620px,100%);padding:10px 14px;font-size:14px;text-align:center;text-wrap:balance;background:var(--glass);border:1px solid var(--accent);border-radius:2px}
#botRow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;width:100%}
#hint{margin:0;color:var(--fg);font:400 11px/1.5 var(--mono);letter-spacing:.04em;background:var(--glass);padding:5px 9px;border-radius:2px}
#hint:empty{display:none}
#pad{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#pad .btn{padding:14px 14px;touch-action:none}
@media (max-width:640px){
  h1{font-size:18px}
  #panel{top:auto;bottom:0;width:100%;max-height:60%;padding:12px;gap:8px}
  dt,dd{padding:4px 0}
  h2{font-size:28px}
  #speed{width:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  <div id="top">

  <div id="mid">

      <p class="cap" id="sKind">Surface</p>

      <p id="sGoal"></p>

    <aside id="panel" class="glass" hidden>
      <p id="pKlass"></p>
      <h2 id="pName"></h2>
      <p id="pBlurb"></p>
      <dl id="pStats"></dl>
      <p id="pNote"></p>
      <div id="pAct">
        <button id="pGo" class="btn go" type="button">Land</button>
        <button id="pClose" class="btn" type="button">Close</button>
      </div>
    </aside>

    <div id="entry" hidden>
      <div class="tele glass">
        <p id="ePhase">Approach</p>
        <dl>
          <div><dt>Altitude</dt><dd id="eAlt">–</dd></div>
          <div><dt>Velocity</dt><dd id="eVel">–</dd></div>
          <div><dt>Shield load</dt><dd id="eHeat">–</dd></div>
        </dl>
      </div>
    </div>
  </div>

  <div id="bot">
    <p id="toast" role="status" hidden></p>
    <div id="botRow">
      <p id="hint">Drag to orbit · scroll or pinch to zoom · select a world to visit it</p>
      <div id="pad" hidden></div>
    </div>
  </div>
</div>

function h2(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(SEED,1442695041);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h2(xi,yi),h2(xi+1,yi),u),lerp(h2(xi,yi+1),h2(xi+1,yi+1),u),v)}
function fbm(x,y,o){let a=.5,s=0,n=0;for(let i=0;i<o;i++){s+=a*vn(x,y);n+=a;x=x*2.03+17.1;y=y*2.03+9.3;a*=.5}return s/n}
function craters(x,z,cell,prob){let h=0;const cx=Math.floor(x/cell),cz=Math.floor(z/cell);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const gx=cx+i,gz=cz+j;if(h2(gx+7,gz-3)>prob)continue;
    const ox=(gx+.2+.6*h2(gx+91,gz))*cell,oz=(gz+.2+.6*h2(gx,gz+57))*cell,rad=cell*(.12+.28*h2(gx+13,gz+7));
    const d=Math.hypot(x-ox,z-oz)/rad;if(d<1.7){const dep=rad*.22;h+=(d<1?-dep*(1-d*d):0)+dep*.3*Math.exp(-Math.pow((d-1)/.22,2))}}
  return h}

const NOISE=`
float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.02+vec3(3.1,1.7,5.3);a*=.5;}return s/.97;}
`;
const PV=`varying vec3 vO;varying vec3 vN;varying vec3 vW;
void main(){vO=normalize(position);vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const PF=`uniform float uT,uSeed,uBands,uSpot,uCaps,uType;uniform vec3 c1,c2,c3,atm;
varying vec3 vO;varying vec3 vN;varying vec3 vW;
${NOISE}
void main(){
 vec3 p=vO+uSeed;vec3 col;float spec=0.;
 if(uType<.5){
  float n=fbm(p*2.6),m=fbm(p*9.+3.);
  col=mix(c1,c2,smoothstep(.3,.7,n));col=mix(col,c3,smoothstep(.5,.75,m)*.65);col*=.75+.5*fbm(p*24.);
  col=mix(col,vec3(.95),uCaps*smoothstep(.86,.92,abs(vO.y)+(n-.5)*.1));
 }else if(uType<1.5){
  float h=fbm(p*2.3)+.1*fbm(p*10.);float land=smoothstep(.5,.525,h);
  vec3 lc=mix(c2,c3,smoothstep(.56,.72,h+(fbm(p*6.)-.5)*.2));
  lc=mix(lc,vec3(.78,.68,.46),(1.-smoothstep(0.,.2,abs(abs(vO.y)-.32)))*.6);
  col=mix(c1*(.6+.9*h),lc,land);
  col=mix(col,vec3(.96),smoothstep(.84,.9,abs(vO.y)+(h-.5)*.18));
  float cl=smoothstep(.5,.72,fbm(p*3.4+vec3(uT*.012,0.,0.))+.22*fbm(p*13.));
  col=mix(col,vec3(1.),cl*.88);spec=(1.-land)*(1.-cl);
 }else{
  float w=fbm(vec3(p.x*1.5,p.y*5.,p.z*1.5)+vec3(uT*.004,0.,0.));
  float lat=vO.y+(w-.5)*.13;float b=sin(lat*uBands);float f=fbm(vec3(p.x*4.,p.y*18.,p.z*4.));
  col=mix(c1,c2,smoothstep(-.5,.5,b+(f-.5)*.9));col=mix(col,c3,smoothstep(.55,.85,fbm(p*3.+7.))*.5);
  if(uSpot>.5){vec3 dd=vO-normalize(vec3(.72,-.37,.58));float d=length(vec3(dd.x,dd.y*2.1,dd.z));
   float sw=fbm(vO*14.+d*9.);col=mix(mix(vec3(.66,.22,.12),vec3(.86,.46,.3),sw),col,smoothstep(.1,.19,d));}
 }
 vec3 N=normalize(vN),L=normalize(-vW),V=normalize(cameraPosition-vW);
 float d=max(dot(N,L),0.);float day=smoothstep(-.05,.25,dot(N,L));
 vec3 o=col*(d*1.15+.03);
 o+=spec*pow(max(dot(reflect(-L,N),V),0.),40.)*.6*day;
 float fr=pow(1.-max(dot(N,V),0.),2.5);o+=atm*fr*(day*.85+.05);
 gl_FragColor=vec4(o,1.);
}`;
const C=h=>new THREE.Color(h);
function planetMat(p){return new THREE.ShaderMaterial({vertexShader:PV,fragmentShader:PF,uniforms:{uT:{value:0},uSeed:{value:p.seed||0},uBands:{value:p.bands||0},uSpot:{value:p.spot||0},uCaps:{value:p.caps||0},uType:{value:p.type},c1:{value:C(p.c[0])},c2:{value:C(p.c[1])},c3:{value:C(p.c[2])},atm:{value:C(p.atm)}}})}

void main(){float n=fbm(vO*4.+vec3(0.,uT*.12,0.)),m=fbm(vO*13.-vec3(uT*.2));vec3 col=mix(vec3(1.,.42,.04),vec3(1.,.93,.62),n*.75+m*.5);
 float fr=pow(1.-max(dot(normalize(vN),normalize(cameraPosition-vW)),0.),2.);col+=vec3(1.,.5,.1)*fr;gl_FragColor=vec4(col*1.2,1.);}`});
function ringMat(r0,r1,col,op,hor){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{r0:{value:r0},r1:{value:r1},col:{value:C(col)},op:{value:op},uHor:{value:hor?1:0}},
  vertexShader:`varying float vR;varying vec3 vW;void main(){vR=length(position.xy);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform float r0,r1,op,uHor;uniform vec3 col;varying float vR;varying vec3 vW;${NOISE}
void main(){float t=(vR-r0)/(r1-r0);float b=.3+.7*fbm(vec3(t*30.,1.,1.));b*=smoothstep(0.,.03,abs(t-.66));b*=smoothstep(0.,.05,t)*smoothstep(1.,.93,t);

function updBodies(dt,adv){if(adv)simDays+=dt*speed;
  for(const b of bodies){const p=b.p;if(p.d){const a=p.a0+simDays/p.period*TAU;b.group.position.set(Math.cos(a)*p.d,0,-Math.sin(a)*p.d)}
    b.mesh.rotation.y+=dt*p.spin;b.mesh.material.uniforms.uT.value=time}
  const ma=simDays/27.3*TAU;moon.position.copy(earthB.group.position).add(tv.set(Math.cos(ma)*2.1,.15*Math.sin(ma),-Math.sin(ma)*2.1));moon.material.uniforms.uT.value=time;
  scene.userData.belt.rotation.y+=dt*speed*.0014}
function updSpace(dt){const o=orb(),k=1-Math.exp(-dt*5);
  if(view==='system'){updBodies(dt,true);tv.set(0,0,0);if(focusB)tv.copy(focusB.group.position);
    if(focusB&&o.target.distanceTo(tv)<focusB.p.d*.02+.3)o.target.copy(tv);else o.target.lerp(tv,k);
    if(!focusB)o.minR=8}
  else{gal.rotation.y-=dt*.012;o.target.set(0,0,0)}
  o.tR=clamp(o.tR,o.minR,o.maxR);o.r=lerp(o.r,o.tR,k);
  const sp=Math.sin(o.ph);cam.position.set(o.target.x+o.r*sp*Math.sin(o.th),o.target.y+o.r*Math.cos(o.ph),o.target.z+o.r*sp*Math.cos(o.th));cam.up.set(0,1,0);cam.lookAt(o.target);
  stars.position.copy(cam.position);
  if(view==='system'){for(const b of bodies)placeLabel(b.el,b.group.position,b.p.r)}
  else{sunMark.getWorldPosition(tv);placeLabel(sunLab,tv.clone(),1);placeLabel(coreLab,new V3(0,0,0),5)}}

/* ---------------- main loop ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();plasma.uniforms.uA.value=w/h}
addEventListener('resize',resize);resize();
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);last=now;time+=dt;
  sunMat.uniforms.uT.value=time;plasma.uniforms.uT.value=time;
  if(state==='space')updSpace(dt);
  else if(state==='entry'){updBodies(dt,false);updEntry(dt)}
  else if(state==='surface')updSurface(dt);
  if(state!=='entry'||!entry){const d=fade.target-fade.a;fade.a+=Math.sign(d)*Math.min(Math.abs(d),fade.speed*dt);
    if(fade.cb&&fade.a>=.999){const cb=fade.cb;fade.cb=null;fade.target=0;cb()}}
  fade.el.style.opacity=fade.a.toFixed(3);
  const te=$('toast');if(tT>0){tT-=dt;if(tT<=0)te.hidden=true}else if(tq.length){const m=tq.shift();te.textContent=m[0];te.hidden=false;tT=m[1]}
  renderer.clear();
  renderer.render((state==='surface'||state==='leaving')&&W?surfScene:(view==='galaxy'?gScene:scene),cam);
  if(plasma.uniforms.uI.value>.004){renderer.clearDepth();renderer.render(oScene,oCam)}}
requestAnimationFrame(frame);

// small hook so a test can drive the app
window.__orrery={visit:id=>{const b=bodies.find(x=>x.p.id===id);if(b){focusBody(b);startEntry(b)}},state:()=>state,world:()=>W,player:pl,launch};
})();
</script>
